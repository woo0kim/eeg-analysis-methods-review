# The GPU variant of dDTF-GL (the paper's "Our Method (GPU)"): environment.yml with XGBoost's CUDA build of the same version.
# Versions of the runs: conda_list_gpu.txt (conda list --export, mcl-server, 2026-11-13). The solve needs a CUDA >= 12.8 driver, or
#   CONDA_OVERRIDE_CUDA=12.8 conda env create -f environment_gpu.yml
name: ddtf-gl-gpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - scikit-learn
  - pywavelets
  - py-xgboost=3.4.2=*cuda*
  - matplotlib
  - tqdm
  - pyyaml
  - opencv
  - python-lmdb
  - mne-base
