# The environment of every dDTF-GL run: the authors' bundle's environment.yml (upstream/environment.yml: python 3.11, numpy, scipy,
# scikit-learn, pywavelets, xgboost, matplotlib, tqdm, pyyaml, opencv) plus python-lmdb (CBraMod's LMDBs) and mne-base (STEW
# filtering). Versions of the runs: conda_list.txt (conda list --export, mcl-server, 2026-11-11).
#   conda env create -f environment.yml && conda activate ddtf-gl
name: ddtf-gl
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - scikit-learn
  - pywavelets
  - xgboost
  - matplotlib
  - tqdm
  - pyyaml
  - opencv
  - python-lmdb
  - mne-base
